<div class="bg-orange-50 p-6 rounded-lg border border-orange-200 shadow-sm">
    <h3 class="text-2xl font-bold text-orange-900 mb-6 border-b border-orange-200 pb-2">{{ deck.titulo }}</h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for card in deck.cards %}
        <div class="group perspective-1000 cursor-pointer h-48">
            <div class="relative w-full h-full transition-transform duration-500 transform-style-preserve-3d group-hover:rotate-y-180">
                <div class="absolute w-full h-full backface-hidden bg-white rounded-lg shadow-md border-t-4 border-orange-400 p-6 flex flex-col justify-center items-center text-center">
                    <span class="text-xs uppercase font-bold text-orange-400 mb-2">Frente</span>
                    <p class="font-semibold text-gray-800">{{ card.frente }}</p>
                </div>
                <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-gray-800 rounded-lg shadow-md border-t-4 border-gray-600 p-6 flex flex-col justify-center items-center text-center overflow-y-auto">
                    <span class="text-xs uppercase font-bold text-gray-400 mb-2">Verso</span>
                    <p class="text-white text-sm">{{ card.verso }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
/* Utilitários extras para o efeito 3D do Flashcard (já que o Tailwind padrão não tem rotate-y out-of-the-box sem plugin) */
.perspective-1000 { perspective: 1000px; }
.transform-style-preserve-3d { transform-style: preserve-3d; }
.backface-hidden { backface-visibility: hidden; }
.rotate-y-180 { transform: rotateY(180deg); }
.group:hover .group-hover\:rotate-y-180 { transform: rotateY(180deg); }
</style>
