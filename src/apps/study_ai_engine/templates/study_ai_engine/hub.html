{% extends "base.html" %}

{% block title %}Laboratório IA | EstudaAI{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-2 text-gray-800">Laboratório de Revisão Inteligente</h2>
    <p class="text-gray-600 mb-8">A IA utilizará seu histórico e anotações recentes para gerar os materiais.</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-white shadow-md rounded-lg p-6 border-t-4 border-indigo-500">
            <h3 class="text-xl font-bold mb-3 flex items-center text-gray-800">
                <svg class="w-6 h-6 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Gerar Simulado
            </h3>

            <form hx-post="{% url 'study_ai_engine-ui:generate-quiz' %}"
                  hx-target="#ai-content"
                  hx-indicator="#loading-spinner">
                {% csrf_token %}
                <input type="text" name="topic" class="w-full border-gray-300 rounded-md focus:ring-indigo-500 mb-4"
                       placeholder="Ex: Arquitetura Orientada a Eventos" required>
                <button type="submit" class="w-full bg-indigo-100 text-indigo-700 font-bold py-2 px-4 rounded hover:bg-indigo-200 transition">
                    Criar Simulado
                </button>
            </form>
        </div>

        <div class="bg-white shadow-md rounded-lg p-6 border-t-4 border-orange-500">
            <h3 class="text-xl font-bold mb-3 flex items-center text-gray-800">
                <svg class="w-6 h-6 mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Gerar Flashcards
            </h3>

            <form hx-post="{% url 'study_ai_engine-ui:generate-flashcards' %}"
                  hx-target="#ai-content"
                  hx-indicator="#loading-spinner">
                {% csrf_token %}
                <input type="text" name="topic" class="w-full border-gray-300 rounded-md focus:ring-orange-500 mb-4"
                       placeholder="Ex: Design Pattern Flyweight em C++" required>
                <button type="submit" class="w-full bg-orange-100 text-orange-700 font-bold py-2 px-4 rounded hover:bg-orange-200 transition">
                    Criar Flashcards
                </button>
            </form>
        </div>
    </div>

    <div id="loading-spinner" class="htmx-indicator text-center mt-12">
        <svg class="inline w-10 h-10 text-gray-200 animate-spin fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
            <path d="M93.9676 39.0409C96.393 38.4018 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5422 39.68 93.9676 39.0409Z" fill="currentFill"/>
        </svg>
    </div>

    <div id="ai-content" class="mt-8"></div>
</div>
{% endblock %}
