<div class="study-item-row grid grid-cols-1 md:grid-cols-12 gap-4 items-start border border-gray-200 p-4 rounded-lg bg-gray-50 relative group">

    <div class="md:col-span-4">
        <label class="block text-sm font-bold text-gray-700 mb-1">Tópico</label>
        <select name="content_id" class="w-full border-gray-300 rounded-md focus:ring-blue-500" required>
            <option value="" disabled selected>Selecione a matéria...</option>
            {% for content in contents %}
                <option value="{{ content.id }}">{{ content.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="md:col-span-2">
        <label class="block text-sm font-bold text-gray-700 mb-1">Tempo (min)</label>
        <input type="number" name="time_minutes" min="1" class="w-full border-gray-300 rounded-md focus:ring-blue-500" required>
    </div>

    <div class="md:col-span-6 relative">
        <label class="block text-sm font-bold text-gray-700 mb-1">Anotações / Dúvidas</label>
        <textarea name="notes" rows="2" class="w-full border-gray-300 rounded-md focus:ring-blue-500"
                  placeholder="Ex: Padrão Estrutural Composite em Java, Pipeline RISC Orion-16..."></textarea>

        {% if uid != 'init' %}
        <button type="button" onclick="this.closest('.study-item-row').remove()" class="absolute -top-2 -right-2 bg-red-100 text-red-600 rounded-full p-1 opacity-0 group-hover:opacity-100 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        {% endif %}
    </div>
</div>
