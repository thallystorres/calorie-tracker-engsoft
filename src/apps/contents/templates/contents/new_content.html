{% extends "base.html" %}
{% block content %}
<div class="container mx-auto p-8">
    <h2 class="text-2xl font-bold mb-4">Cadastrar Novo Conteúdo</h2>
    <form hx-post="{% url 'contents:list-create' %}" hx-target="#feedback" class="bg-white p-6 rounded shadow">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Nome do Tópico" class="w-full border p-2 mb-4" required>
        <input type="number" name="difficulty_level" placeholder="Dificuldade (1-5)" class="w-full border p-2 mb-4" min="1" max="5">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Salvar</button>
        <div id="feedback"></div>
    </form>
</div>
{% endblock %}
